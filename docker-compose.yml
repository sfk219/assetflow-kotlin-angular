services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/assetflow
    depends_on:
      mongo:
        condition: service_healthy
    ports: ["8080:8080"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["4200:80"]
volumes:
  mongo-data:
